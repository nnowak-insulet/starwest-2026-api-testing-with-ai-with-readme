openapi: 3.0.3
info:
  title: E-commerce REST API
  description: |
    REST API for an e-commerce application that allows users to register, login
    (JWT authentication), and perform checkout. Checkout accepts only cash or
    credit card. Cash payments receive a 10% discount. Only authenticated users
    can checkout.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: User registration and authentication
  - name: Checkout
    description: Order checkout operations
  - name: Health
    description: API health status

paths:
  /register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account in memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: dave
              email: dave@example.com
              password: password123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /login:
    post:
      tags:
        - Auth
      summary: Login and obtain a JWT token
      description: Authenticates a user and returns a JWT Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /checkout:
    post:
      tags:
        - Checkout
      summary: Perform a checkout
      description: |
        Creates an order for the authenticated user. Accepted payment methods
        are `cash` and `credit_card`. Cash payments receive a 10% discount.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              items:
                - productId: 1
                  quantity: 2
                - productId: 3
                  quantity: 1
              paymentMethod: cash
      responses:
        '200':
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid request body or payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /healthcheck:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: dave
        email:
          type: string
          format: email
          example: dave@example.com
        password:
          type: string
          format: password
          example: password123

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: password123

    CheckoutRequest:
      type: object
      required:
        - items
        - paymentMethod
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: integer
                example: 1
              quantity:
                type: integer
                minimum: 1
                example: 2
        paymentMethod:
          type: string
          enum:
            - cash
            - credit_card
          example: cash

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: alice
        email:
          type: string
          example: alice@example.com

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully
        user:
          $ref: '#/components/schemas/User'

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Headphones
        unitPrice:
          type: number
          format: float
          example: 99.99
        quantity:
          type: integer
          example: 2
        lineTotal:
          type: number
          format: float
          example: 199.98

    CheckoutResponse:
      type: object
      properties:
        message:
          type: string
          example: Checkout completed successfully
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: alice
        order:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            paymentMethod:
              type: string
              example: cash
            subtotal:
              type: number
              format: float
              example: 249.97
            discount:
              type: number
              format: float
              example: 24.997
            discountRate:
              type: number
              format: float
              example: 0.1
            total:
              type: number
              format: float
              example: 224.97

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: API is healthy
        timestamp:
          type: string
          format: date-time
          example: '2026-09-22T16:00:00.000Z'

    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials
